<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sovereign Health Medical Center</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─── FONTS via inline style injection ───
    const fontStyle = `
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Lato:wght@300;400;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap');
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Lato', sans-serif; background: #FDFBF7; color: #1C2B3A; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: #FDFBF7; }
  ::-webkit-scrollbar-thumb { background: #1C2B3A; border-radius: 3px; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }
  @keyframes slideRight {
    from { transform: scaleX(0); } to { transform: scaleX(1); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
  @keyframes marquee {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  @keyframes countUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes borderGrow {
    from { width: 0; } to { width: 60px; }
  }
  
  .page-enter { animation: fadeIn 0.35s ease; }
  
  .fade-up { opacity: 0; transform: translateY(28px); transition: opacity 0.7s ease, transform 0.7s ease; }
  .fade-up.visible { opacity: 1; transform: translateY(0); }

  input, select, textarea {
    font-family: 'Lato', sans-serif;
    -webkit-appearance: none;
    appearance: none;
  }
  
  a { text-decoration: none; }
  button { cursor: pointer; font-family: 'Lato', sans-serif; }
  
  @media (max-width: 768px) {
    .hide-mobile { display: none !important; }
    .show-mobile { display: flex !important; }
  }
  @media (min-width: 769px) {
    .show-mobile { display: none !important; }
  }
`;

    // ─── THEME ───
    const T = {
      navy: "#1C2B3A",
      navyLight: "#243447",
      cream: "#FDFBF7",
      ivory: "#F5F0E8",
      gold: "#B8860B",
      goldLight: "#D4A843",
      goldPale: "#FDF3DC",
      red: "#C0392B",
      teal: "#2E7D82",
      tealLight: "#3E9BA1",
      tealPale: "#E8F4F5",
      text: "#1C2B3A",
      textMid: "#4A5568",
      textLight: "#718096",
      border: "#E8E0D0",
      white: "#FFFFFF",
    };

    // ─── SHARED COMPONENTS ───

    const Logo = ({ white = false }) => (
      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
        <div style={{
          width: 44, height: 44, borderRadius: 10,
          background: white ? "rgba(255,255,255,0.15)" : T.navy,
          border: `2px solid ${white ? "rgba(255,255,255,0.4)" : T.goldLight}`,
          display: "flex", alignItems: "center", justifyContent: "center",
          fontSize: 20, color: white ? "#fff" : T.goldLight,
          flexShrink: 0,
        }}>✚</div>
        <div>
          <div style={{
            fontFamily: "'Playfair Display', serif",
            fontSize: "1.3rem", fontWeight: 700,
            color: white ? "#fff" : T.navy,
            lineHeight: 1,
            letterSpacing: "-0.01em",
          }}>Sovereign<span style={{ color: white ? T.goldLight : T.gold }}> Health</span></div>
          <div style={{ fontSize: "0.62rem", letterSpacing: "0.14em", color: white ? "rgba(255,255,255,0.6)" : T.textLight, textTransform: "uppercase", marginTop: 2 }}>Medical Center</div>
        </div>
      </div>
    );

    const Btn = ({ children, variant = "primary", onClick, style = {}, small = false }) => {
      const [hov, setHov] = useState(false);
      const base = {
        display: "inline-flex", alignItems: "center", gap: 8,
        padding: small ? "9px 20px" : "13px 28px",
        borderRadius: 6, fontWeight: 700, fontSize: small ? "0.78rem" : "0.875rem",
        letterSpacing: "0.05em", textTransform: "uppercase",
        transition: "all 0.25s", border: "none", cursor: "pointer",
      };
      const styles = {
        primary: { background: hov ? T.navyLight : T.navy, color: "#fff" },
        gold: { background: hov ? T.gold : T.goldLight, color: "#fff" },
        outline: { background: "transparent", color: hov ? T.teal : T.navy, border: `2px solid ${hov ? T.teal : T.navy}` },
        outlineWhite: { background: "transparent", color: "#fff", border: "2px solid rgba(255,255,255,0.6)" },
        teal: { background: hov ? T.teal : T.tealLight, color: "#fff" },
        ghost: { background: hov ? T.ivory : "transparent", color: T.navy, border: `1px solid ${T.border}` },
      };
      return (
        <button
          style={{ ...base, ...styles[variant], ...style }}
          onMouseEnter={() => setHov(true)}
          onMouseLeave={() => setHov(false)}
          onClick={onClick}
        >{children}</button>
      );
    };

    const SectionLabel = ({ children, center = false, light = false }) => (
      <div style={{ display: "flex", alignItems: "center", gap: 12, justifyContent: center ? "center" : "flex-start", marginBottom: 16 }}>
        <div style={{ width: 32, height: 2, background: light ? T.goldLight : T.gold, borderRadius: 1, flexShrink: 0 }} />
        <span style={{ fontSize: "0.68rem", fontWeight: 700, letterSpacing: "0.16em", textTransform: "uppercase", color: light ? T.goldLight : T.gold }}>{children}</span>
        <div style={{ width: 32, height: 2, background: light ? T.goldLight : T.gold, borderRadius: 1, flexShrink: 0 }} />
      </div>
    );

    const SectionTitle = ({ children, center = false, light = false, style = {} }) => (
      <h2 style={{
        fontFamily: "'Playfair Display', serif",
        fontSize: "clamp(2rem, 3.5vw, 2.9rem)",
        fontWeight: 500,
        lineHeight: 1.2,
        color: light ? "#fff" : T.navy,
        textAlign: center ? "center" : "left",
        letterSpacing: "-0.02em",
        ...style,
      }}>{children}</h2>
    );

    function useScrollFade() {
      const ref = useRef(null);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const els = el.querySelectorAll(".fade-up");
        const obs = new IntersectionObserver((entries) => {
          entries.forEach((e, i) => {
            if (e.isIntersecting) {
              setTimeout(() => e.target.classList.add("visible"), i * 80);
              obs.unobserve(e.target);
            }
          });
        }, { threshold: 0.08 });
        els.forEach(e => obs.observe(e));
        return () => obs.disconnect();
      }, []);
      return ref;
    }

    // ─── NAV ───
    const Nav = ({ page, setPage }) => {
      const [scrolled, setScrolled] = useState(false);
      const [menuOpen, setMenuOpen] = useState(false);

      useEffect(() => {
        const fn = () => setScrolled(window.scrollY > 30);
        window.addEventListener("scroll", fn);
        return () => window.removeEventListener("scroll", fn);
      }, []);

      const links = [
        { id: "home", label: "Home" },
        { id: "about", label: "About" },
        { id: "departments", label: "Departments" },
        { id: "doctors", label: "Doctors" },
        { id: "patients", label: "Patients" },
        { id: "contact", label: "Contact" },
      ];

      return (
        <>
          {/* Emergency strip */}
          <div style={{ background: T.red, color: "#fff", textAlign: "center", padding: "8px 1rem", fontSize: "0.76rem", fontWeight: 700, letterSpacing: "0.04em", position: "relative", zIndex: 1001 }}>
            🚨 24/7 EMERGENCY: <a href="tel:18009119911" style={{ color: "#fff", textDecoration: "underline" }}>1-800-911-9911</a> &nbsp;|&nbsp; Ambulance Dispatch Available Around the Clock
          </div>

          {/* Main nav */}
          <nav style={{
            position: "sticky", top: 0, zIndex: 1000,
            background: scrolled ? "rgba(253,251,247,0.96)" : T.cream,
            backdropFilter: "blur(12px)",
            borderBottom: `1px solid ${T.border}`,
            padding: "0 2rem",
            height: 70, display: "flex", alignItems: "center", justifyContent: "space-between",
            transition: "box-shadow 0.3s",
            boxShadow: scrolled ? "0 2px 24px rgba(28,43,58,0.08)" : "none",
          }}>
            <div style={{ cursor: "pointer" }} onClick={() => setPage("home")}>
              <Logo />
            </div>

            {/* Desktop links */}
            <ul className="hide-mobile" style={{ display: "flex", gap: "0.2rem", listStyle: "none", margin: 0 }}>
              {links.map(l => (
                <li key={l.id}>
                  <button
                    onClick={() => { setPage(l.id); setMenuOpen(false); }}
                    style={{
                      background: "none", border: "none",
                      padding: "8px 14px", borderRadius: 6,
                      fontSize: "0.82rem", fontWeight: 700,
                      letterSpacing: "0.05em", textTransform: "uppercase",
                      color: page === l.id ? T.teal : T.textMid,
                      cursor: "pointer",
                      transition: "color 0.2s",
                      borderBottom: page === l.id ? `2px solid ${T.teal}` : "2px solid transparent",
                    }}
                  >{l.label}</button>
                </li>
              ))}
            </ul>

            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <Btn small variant="gold" onClick={() => setPage("patients")}>📅 Book Now</Btn>
              {/* Mobile hamburger */}
              <button
                className="show-mobile"
                style={{ background: "none", border: `1px solid ${T.border}`, padding: "8px 10px", borderRadius: 6 }}
                onClick={() => setMenuOpen(!menuOpen)}
              >
                <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                  {[0, 1, 2].map(i => (
                    <span key={i} style={{
                      display: "block", width: 22, height: 2, background: T.navy, borderRadius: 2,
                      transform: menuOpen && i === 0 ? "rotate(45deg) translate(4px, 4px)" : menuOpen && i === 2 ? "rotate(-45deg) translate(4px, -4px)" : "none",
                      opacity: menuOpen && i === 1 ? 0 : 1, transition: "all 0.3s"
                    }} />
                  ))}
                </div>
              </button>
            </div>
          </nav>

          {/* Mobile menu */}
          {menuOpen && (
            <div style={{
              position: "fixed", top: 118, left: 0, right: 0, bottom: 0,
              background: T.cream, zIndex: 999,
              padding: "2rem", display: "flex", flexDirection: "column", gap: "0.5rem",
              animation: "fadeIn 0.2s ease",
              overflowY: "auto",
            }}>
              {links.map(l => (
                <button key={l.id} onClick={() => { setPage(l.id); setMenuOpen(false); }}
                  style={{
                    background: page === l.id ? T.ivory : "none", border: "none",
                    padding: "1rem 1.25rem", borderRadius: 8, textAlign: "left",
                    fontSize: "1.1rem", fontWeight: 700, color: page === l.id ? T.teal : T.navy,
                    letterSpacing: "0.03em", borderLeft: page === l.id ? `4px solid ${T.teal}` : "4px solid transparent",
                  }}>{l.label}
                </button>
              ))}
              <div style={{ marginTop: "1rem" }}>
                <Btn variant="gold" onClick={() => { setPage("patients"); setMenuOpen(false); }} style={{ width: "100%", justifyContent: "center" }}>📅 Book Appointment</Btn>
              </div>
            </div>
          )}
        </>
      );
    };

    // ─── PAGE: HOME ───
    const HomePage = ({ setPage }) => {
      const ref = useScrollFade();
      const [count, setCount] = useState({ a: 0, b: 0, c: 0, d: 0 });
      const countRef = useRef(null);

      useEffect(() => {
        const obs = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) {
            const targets = { a: 95, b: 1200, c: 50, d: 40 };
            const dur = 1800;
            const start = Date.now();
            const tick = () => {
              const t = Math.min(1, (Date.now() - start) / dur);
              const ease = 1 - Math.pow(1 - t, 3);
              setCount({
                a: Math.floor(ease * targets.a),
                b: Math.floor(ease * targets.b),
                c: Math.floor(ease * targets.c),
                d: Math.floor(ease * targets.d),
              });
              if (t < 1) requestAnimationFrame(tick);
            };
            tick();
            obs.disconnect();
          }
        }, { threshold: 0.3 });
        if (countRef.current) obs.observe(countRef.current);
        return () => obs.disconnect();
      }, []);

      const depts = [
        { icon: "❤️", name: "Cardiac Sciences", desc: "Interventional cardiology, open-heart surgery, electrophysiology", color: "#FFF0EE" },
        { icon: "🧠", name: "Neurosciences", desc: "Neurosurgery, stroke unit, cognitive neurology, spine", color: "#EEF4FF" },
        { icon: "🦴", name: "Orthopaedics", desc: "Joint replacement, sports injuries, spine surgery, trauma", color: "#F0FFF4" },
        { icon: "🔬", name: "Oncology Center", desc: "Medical, surgical & radiation oncology with precision therapy", color: "#FFF9EE" },
        { icon: "👶", name: "Women & Child", desc: "Maternity, NICU, pediatric surgery, fetal medicine", color: "#F5EEFF" },
        { icon: "🫁", name: "Pulmonology", desc: "Respiratory care, sleep disorders, bronchoscopy, COPD", color: "#EEFBFF" },
      ];

      const news = [
        { tag: "Research", date: "Mar 14, 2026", title: "Sovereign Health Performs First Robotic Kidney Transplant in the Region", img: "🔬" },
        { tag: "Award", date: "Mar 8, 2026", title: "Named #1 Hospital for Cardiac Care by National Health Board 2026", img: "🏆" },
        { tag: "Community", date: "Feb 28, 2026", title: "Free Health Screening Camp Reaches 20,000 Patients This Quarter", img: "🤝" },
      ];

      return (
        <div ref={ref}>
          {/* HERO */}
          <div style={{
            minHeight: "92vh",
            background: `linear-gradient(105deg, ${T.navy} 0%, ${T.navyLight} 40%, #2A3F52 100%)`,
            display: "flex", alignItems: "center",
            position: "relative", overflow: "hidden",
            padding: "4rem 2rem",
          }}>
            {/* Decorative */}
            <div style={{ position: "absolute", inset: 0, backgroundImage: "radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px)", backgroundSize: "48px 48px" }} />
            <div style={{ position: "absolute", right: "-5%", top: "10%", width: "45vw", maxWidth: 700, aspectRatio: "1", borderRadius: "50%", background: "radial-gradient(circle, rgba(184,134,11,0.12) 0%, transparent 65%)" }} />
            <div style={{ position: "absolute", left: "30%", bottom: "-10%", width: 400, height: 400, borderRadius: "50%", background: "radial-gradient(circle, rgba(46,125,130,0.18) 0%, transparent 65%)" }} />

            <div style={{ maxWidth: 1200, margin: "0 auto", width: "100%", display: "grid", gridTemplateColumns: "1fr 1fr", gap: "4rem", alignItems: "center", position: "relative", zIndex: 2 }}>
              <div>
                {/* Badge */}
                <div style={{ display: "inline-flex", alignItems: "center", gap: 8, background: "rgba(184,134,11,0.15)", border: "1px solid rgba(184,134,11,0.35)", borderRadius: 100, padding: "6px 16px", marginBottom: "1.75rem" }}>
                  <span style={{ fontSize: "0.6rem", color: T.goldLight }}>★★★★★</span>
                  <span style={{ fontSize: "0.72rem", fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase", color: T.goldLight }}>JCI & NABH Gold Accredited</span>
                </div>

                <h1 style={{ fontFamily: "'Playfair Display', serif", fontSize: "clamp(2.6rem, 5.5vw, 4.2rem)", fontWeight: 500, color: "#fff", lineHeight: 1.08, letterSpacing: "-0.03em", marginBottom: "1.5rem" }}>
                  Where Healing<br />
                  <em style={{ color: T.goldLight, fontStyle: "italic" }}>Meets Excellence</em><br />
                  <span style={{ fontWeight: 700 }}>& Compassion</span>
                </h1>

                <p style={{ color: "rgba(255,255,255,0.72)", fontSize: "1.05rem", lineHeight: 1.8, maxWidth: 480, marginBottom: "2.5rem", fontFamily: "'Lato', sans-serif", fontWeight: 300 }}>
                  Sovereign Health Medical Center delivers quaternary-level care across 50+ specialties — backed by world-class technology and a thousand compassionate hands.
                </p>

                <div style={{ display: "flex", gap: "1rem", flexWrap: "wrap" }}>
                  <Btn variant="gold" onClick={() => setPage("patients")}>📅 Book Appointment</Btn>
                  <Btn variant="outlineWhite" onClick={() => setPage("departments")}>Explore Departments →</Btn>
                </div>

                {/* Accreditation logos row */}
                <div style={{ display: "flex", alignItems: "center", gap: "1.5rem", marginTop: "2.5rem", flexWrap: "wrap" }}>
                  {["JCI Certified", "NABH Gold", "ISO 9001", "HIMSS Level 7"].map(a => (
                    <div key={a} style={{ background: "rgba(255,255,255,0.08)", border: "1px solid rgba(255,255,255,0.15)", borderRadius: 6, padding: "6px 12px", fontSize: "0.7rem", fontWeight: 700, letterSpacing: "0.07em", color: "rgba(255,255,255,0.65)", textTransform: "uppercase" }}>{a}</div>
                  ))}
                </div>
              </div>

              {/* Quick Appointment Card */}
              <div className="hide-mobile" style={{ background: "rgba(255,255,255,0.06)", backdropFilter: "blur(20px)", border: "1px solid rgba(255,255,255,0.14)", borderRadius: 20, padding: "2rem", }}>
                <div style={{ fontFamily: "'Playfair Display', serif", fontSize: "1.3rem", color: "#fff", marginBottom: "0.4rem" }}>Find a Specialist</div>
                <div style={{ fontSize: "0.8rem", color: "rgba(255,255,255,0.55)", marginBottom: "1.5rem" }}>Same-day appointments available</div>

                {[
                  { label: "Department", options: ["Cardiology", "Neurology", "Oncology", "Orthopaedics", "Pediatrics"] },
                  { label: "Consultation Type", options: ["In-Person Visit", "Video Consult", "Emergency"] },
                ].map(f => (
                  <div key={f.label} style={{ marginBottom: "1rem" }}>
                    <label style={{ display: "block", fontSize: "0.68rem", fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase", color: "rgba(255,255,255,0.55)", marginBottom: 6 }}>{f.label}</label>
                    <select style={{ width: "100%", background: "rgba(255,255,255,0.1)", border: "1.5px solid rgba(255,255,255,0.2)", borderRadius: 8, padding: "11px 14px", color: "#fff", fontSize: "0.875rem" }}>
                      {f.options.map(o => <option key={o} style={{ background: T.navy }}>{o}</option>)}
                    </select>
                  </div>
                ))}

                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "1rem", marginBottom: "1.25rem" }}>
                  {["Preferred Date", "Preferred Time"].map(l => (
                    <div key={l}>
                      <label style={{ display: "block", fontSize: "0.68rem", fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase", color: "rgba(255,255,255,0.55)", marginBottom: 6 }}>{l}</label>
                      <input type={l.includes("Date") ? "date" : "time"} style={{ width: "100%", background: "rgba(255,255,255,0.1)", border: "1.5px solid rgba(255,255,255,0.2)", borderRadius: 8, padding: "11px 14px", color: "#fff", fontSize: "0.875rem", colorScheme: "dark" }} />
                    </div>
                  ))}
                </div>
                <Btn variant="gold" style={{ width: "100%", justifyContent: "center" }} onClick={() => setPage("patients")}>Search Availability →</Btn>

                {/* Trust signals */}
                <div style={{ display: "flex", justifyContent: "space-around", marginTop: "1.5rem", paddingTop: "1.5rem", borderTop: "1px solid rgba(255,255,255,0.1)" }}>
                  {[["⚡", "Instant Confirm"], ["🔒", "Secure & Private"], ["💬", "24/7 Support"]].map(([icon, label]) => (
                    <div key={label} style={{ textAlign: "center" }}>
                      <div style={{ fontSize: "1.2rem", marginBottom: 4 }}>{icon}</div>
                      <div style={{ fontSize: "0.65rem", color: "rgba(255,255,255,0.5)", fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase" }}>{label}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>

          {/* STATS COUNTER */}
          <div ref={countRef} style={{ background: T.gold, padding: "3rem 2rem" }}>
            <div style={{ maxWidth: 1200, margin: "0 auto", display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: "2rem", textAlign: "center" }}>
              {[
                { val: `${count.a}%`, label: "Patient Satisfaction", sub: "Based on 40,000+ surveys" },
                { val: `${count.b}+`, label: "Beds Across Campuses", sub: "ICU, HDU, General & Day" },
                { val: `${count.c}+`, label: "Clinical Specialties", sub: "Quaternary-level care" },
                { val: `${count.d}+`, label: "Years of Excellence", sub: "Serving since 1985" },
              ].map(s => (
                <div key={s.label}>
                  <div style={{ fontFamily: "'Playfair Display', serif", fontSize: "clamp(2rem, 4vw, 3rem)", fontWeight: 700, color: "#fff", lineHeight: 1 }}>{s.val}</div>
                  <div style={{ fontWeight: 700, color: "rgba(255,255,255,0.9)", fontSize: "0.875rem", marginTop: 6, letterSpacing: "0.04em" }}>{s.label}</div>
                  <div style={{ fontSize: "0.72rem", color: "rgba(255,255,255,0.65)", marginTop: 3 }}>{s.sub}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Marquee */}
          <div style={{ background: T.navy, padding: "14px 0", overflow: "hidden", borderBottom: `3px solid ${T.gold}` }}>
            <div style={{ display: "flex", animation: "marquee 30s linear infinite", width: "max-content" }}>
              {Array(2).fill(["Cardiac Surgery", "Robotic Procedures", "Bone Marrow Transplant", "Liver & Kidney Transplant", "Fetal Medicine", "Neuro-Oncology", "Spine Surgery", "Gamma Knife Radiosurgery", "TAVI / TAVR", "IVF & Fertility"]).flat().map((item, i) => (
                <span key={i} style={{ padding: "0 2rem", fontSize: "0.75rem", fontWeight: 700, letterSpacing: "0.12em", textTransform: "uppercase", color: "rgba(255,255,255,0.55)", whiteSpace: "nowrap", borderRight: "1px solid rgba(255,255,255,0.1)" }}>
                  <span style={{ color: T.goldLight, marginRight: 8 }}>✦</span>{item}
                </span>
              ))}
            </div>
          </div>

          {/* DEPARTMENTS */}
          <section style={{ padding: "6rem 2rem", background: T.cream }}>
            <div style={{ maxWidth: 1200, margin: "0 auto" }}>
              <div className="fade-up" style={{ textAlign: "center", marginBottom: "3.5rem" }}>
                <SectionLabel center>Clinical Excellence</SectionLabel>

                        <div style={{ fontWeight: 700, color: T.goldLight, fontSize: "0.85rem" }}>{c.name}</div>

                      <input style={{ width: "100%", padding: "11px 14px", background: T.ivory, border: `1.5px solid ${T.border}`, borderRadius: 8, fontSize: "0.875rem", color: T.text, fontFamily: "'Lato', sans-serif" }} placeholder={`Enter ${l.toLowerCase()}`} />

        </div>
      );
    };

        <div style={{ maxWidth: 1200, margin: "0 auto" }}>
          <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1fr 1fr", gap: "3rem", marginBottom: "3.5rem", flexWrap: "wrap" }}>
            <div>
              <Logo white />

              </p>
              <div style={{ display: "flex", gap: 10 }}>
                {["𝕏", "f", "in", "📷", "▶"].map(s => (

                <ul style={{ listStyle: "none", display: "flex", flexDirection: "column", gap: "0.7rem" }}>
                  {col.links.map(l => (
                    <li key={l}><span style={{ fontSize: "0.875rem", color: "rgba(255,255,255,0.65)", cursor: "pointer", transition: "color 0.2s" }}

            ))}

          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: "1rem" }}>
            <p style={{ fontSize: "0.78rem", color: "rgba(255,255,255,0.35)" }}>© 2026 Sovereign Health Medical Center. All rights reserved.</p>
            <p style={{ fontSize: "0.78rem", color: "rgba(255,255,255,0.35)" }}>Designed with care for those who care.</p>
          </div>
        </div>
      </footer>
    );

    // ─── SCROLL TO TOP ───
    const ScrollTop = () => {
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const fn = () => setVisible(window.scrollY > 600);
        window.addEventListener("scroll", fn);
        return () => window.removeEventListener("scroll", fn);
      }, []);
      if (!visible) return null;
      return (
        <button onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}
          style={{ position: "fixed", bottom: "2rem", right: "2rem", width: 48, height: 48, background: T.navy, border: `2px solid ${T.gold}`, borderRadius: 12, color: T.goldLight, fontSize: 18, zIndex: 900, boxShadow: "0 8px 24px rgba(28,43,58,0.25)", transition: "all 0.3s", animation: "fadeIn 0.3s ease" }}
          onMouseEnter={e => { e.currentTarget.style.background = T.gold; e.currentTarget.style.color = "#fff"; }}
          onMouseLeave={e => { e.currentTarget.style.background = T.navy; e.currentTarget.style.color = T.goldLight; }}>
          ↑
        </button>
      );
    };

    // ─── APP ───
    function App() {
      const [page, setPage] = useState("home");

      const changePage = (p) => {
        setPage(p);
        setTimeout(() => window.scrollTo({ top: 0, behavior: "smooth" }), 10);
      };

      const pages = { home: <HomePage setPage={changePage} />, about: <AboutPage />, departments: <DepartmentsPage />, doctors: <DoctorsPage setPage={changePage} />, patients: <PatientsPage />, contact: <ContactPage /> };

      return (
        <>
          <style>{fontStyle}</style>
          <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column" }}>
            <Nav page={page} setPage={changePage} />
            <main style={{ flex: 1 }} className="page-enter" key={page}>
              {pages[page] || <HomePage setPage={changePage} />}

            {/* DEV CTA GRAND */}
            <section style={{ padding: "5rem 2rem", background: T.ivory, display: "flex", justifyContent: "center" }}>
              <div style={{ width: "100%", maxWidth: 1000, background: T.navy, color: "#fff", borderRadius: 24, padding: "3.5rem 4rem", border: `1px solid ${T.goldLight}`, boxShadow: "0 24px 60px rgba(28,43,58,0.2)", position: "relative", overflow: "hidden", display: "flex", flexWrap: "wrap", justifyContent: "space-between", alignItems: "center", gap: "3rem" }}>
                <div style={{ position: "absolute", right: -100, top: -100, width: 300, height: 300, borderRadius: "50%", background: `radial-gradient(circle, ${T.gold} 0%, transparent 60%)`, opacity: 0.15 }} />
                <div style={{ flex: "1 1 400px", position: "relative", zIndex: 2 }}>
                  <SectionLabel light>System Architect</SectionLabel>
                  <h2 style={{ fontFamily: "'Playfair Display', serif", fontSize: "clamp(2rem, 4vw, 2.6rem)", color: "#fff", marginBottom: "1rem", lineHeight: 1.2 }}>
                    Designed & Built by<br /><em style={{ color: T.goldLight, fontStyle: "italic" }}>Sushant Raj Mishra</em>
                  </h2>
                  <p style={{ color: "rgba(255,255,255,0.7)", fontFamily: "'Lato', sans-serif", fontSize: "1rem", lineHeight: 1.7, maxWidth: 450 }}>
                    Delivering premium, high-performance web applications with uncompromised aesthetics and scalable architecture.
                  </p>
                </div>
                <div style={{ flexShrink: 0, position: "relative", zIndex: 2 }}>
                  <Btn variant="gold" onClick={() => window.open('https://sushantrm.com.np/', '_blank')} style={{ padding: "14px 32px", fontSize: "1.05rem", textTransform: "none" }}>Hire Developer ↗</Btn>
                </div>
              </div>
            </section>
            <Footer setPage={changePage} />
            <ScrollTop />
          </div>
        </>
      );

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
